name: Validate ASP.NET sample

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Publish and check HTTP behavior
        run: bash scripts/smoke-test.sh
      - name: Test weather proxy with deterministic upstream responses
        run: dotnet test tests/BuilderDotnetSample.Tests/BuilderDotnetSample.Tests.csproj -p:RestoreConfigFile=NuGet.Config
